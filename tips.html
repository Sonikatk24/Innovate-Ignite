  <h2>Earthquake</h2>
  <ul>
    <li>Drop, Cover, and Hold On</li>
    <li>Stay away from windows</li>
  </ul>

  <h2>Flood</h2>
  <ul>
    <li>Move to higher ground</li>
    <li>Avoid walking or driving through floodwaters</li>
  </ul>

  <h2>Heatwave</h2>
  <ul>
    <li>Stay hydrated and indoors</li>
    <li>Avoid strenuous activity during peak heat hours</li>
  </ul>
